services:
  - type: web
    name: scd-transport-next
    runtime: node
    plan: free
    rootDir: nextjs-app
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Dependencies are already installed during build. Starting through npm
    # avoids a Corepack network download during each runtime boot.
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SCAN_SERVICE_URL
        sync: false
