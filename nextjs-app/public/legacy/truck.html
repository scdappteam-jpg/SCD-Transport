<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>สถานะรถ · S.C.D.TRANSPORT</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&display=swap">
  <style>
    :root{--bg:#eef4fb;--card:#fff;--ink:#14213a;--muted:#5d6b84;--line:#dbe6f3;--accent:#0b4ea2;--ok:#0b6b3a;--warn:#9a5b00}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Kanit,"Leelawadee UI",Tahoma,sans-serif}
    main{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right));display:grid;gap:14px}
    header{display:flex;align-items:center;gap:12px}
    .mark{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600}
    h1{margin:0;font-size:20px;font-weight:600}
    .sub{margin:0;color:var(--muted);font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
    .plate{font-size:26px;font-weight:600;letter-spacing:.02em}
    .house{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
    .house:first-of-type{border-top:0}
    .house b{font-size:17px}
    .step{display:inline-block;padding:2px 10px;border-radius:999px;background:#e6eefb;color:var(--accent);font-size:13px;font-weight:500}
    .dock{color:var(--warn);font-weight:500}
    .muted{color:var(--muted);font-size:14px}
    button{min-height:52px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 17px Kanit,sans-serif;cursor:pointer}
    button:disabled{opacity:.6}
    button:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}
    .done{color:var(--ok);font-weight:500}
    .error{background:#fde8e6;color:#b42318;border-color:#f3b4a8}
  </style>
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">SCD</div><div><h1>สถานะรถของคุณ</h1><p class="sub">S.C.D.TRANSPORT · หน้านี้แสดงเฉพาะรถคันนี้</p></div></header>
    <section id="truck" class="card" aria-live="polite"><p class="muted">กำลังโหลด…</p></section>
    <button id="arrived" type="button" hidden>แจ้งว่าถึงคลัง WH3 แล้ว</button>
    <p id="arrivedNote" class="muted" role="status"></p>
    <p class="muted">หน้านี้อัปเดตเองทุก 1 นาที ถ้ามีปัญหาติดต่อเจ้าหน้าที่หน้าคลัง</p>
  </main>
  <script src="truck.js?v=20261128"></script>
</body>
</html>
