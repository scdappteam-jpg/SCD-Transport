<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCD Fleet Import</title><style>
body{font-family:Kanit,Arial,sans-serif;background:#f3f6fa;color:#14283d;margin:0;padding:32px}.card{max-width:820px;margin:auto;background:#fff;border-radius:18px;padding:28px;box-shadow:0 16px 45px #17324d1f}h1{margin-top:0}.warning{background:#eff6ff;border:1px solid #93c5fd;border-radius:12px;padding:14px}.row{margin:18px 0}button,input{font:inherit}button{border:0;border-radius:10px;padding:12px 18px;background:#145da0;color:#fff;font-weight:700;cursor:pointer;margin-right:8px}button.danger{background:#b42318}button:disabled{opacity:.45;cursor:not-allowed}pre{white-space:pre-wrap;background:#0f2a43;color:#d9edff;padding:16px;border-radius:12px;min-height:130px}.muted{color:#60758a}
</style></head><body><main class="card">
<h1>นำเข้ารถและคนขับ SCD</h1>
<p class="warning">ระบบจะจับคู่คนขับกับบัญชีเดิมจากชื่อ/เบอร์โทร สร้างเฉพาะบัญชีที่ยังไม่มี และเก็บทะเบียนรถแยกเพื่อรองรับรถที่มีหลายคนขับ</p>
<div class="row"><input id="file" type="file" accept="application/json,.json"></div>
<div class="row"><button id="preview" disabled>ตรวจสอบก่อนนำเข้า</button><button id="apply" class="danger" disabled>นำเข้าจริง</button></div>
<p class="muted">เฉพาะ Admin · บัญชีเดิมไม่ถูกลบ · รหัสผ่านชั่วคราวจะถูกแฮชก่อนบันทึก</p><pre id="result">เลือกไฟล์ Fleet JSON</pre>
</main><script src="/legacy/fleet-import.js"></script></body></html>
