<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ทะเบียนบุคลากร · SCD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Kanit,Arial,sans-serif;color:#13283d;background:#eef3f8}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:1180px;margin:auto;padding:28px 20px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:15px;background:#145da0;color:#fff;display:grid;place-items:center;font-weight:700}.brand h1{font-size:25px;margin:0}.brand p{margin:3px 0 0;color:#64768a}.card{background:#fff;border:1px solid #dce5ee;border-radius:20px;box-shadow:0 16px 42px #14324d14}.login{max-width:460px;margin:8vh auto;padding:28px}.login h2{margin:0 0 6px}.login p{color:#64768a;margin:0 0 24px}.login label{display:block;font-weight:500;margin:14px 0 6px}.login input{width:100%;height:48px;border:1px solid #cbd7e3;border-radius:11px;padding:0 14px;font:inherit}.login button,.logout{border:0;border-radius:11px;background:#145da0;color:#fff;padding:12px 18px;font:600 15px Kanit;cursor:pointer}.login button{width:100%;margin-top:20px}.message{min-height:24px;color:#b42318;margin-top:12px}.toolbar{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.count{color:#60758a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:18px}.person{padding:18px;text-align:center}.photo{width:112px;height:112px;margin:0 auto 14px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#dbeafe,#e9f4fb);display:grid;place-items:center;border:4px solid #fff;box-shadow:0 0 0 1px #d8e4ee}.photo img{width:100%;height:100%;object-fit:cover}.initials{font-size:32px;font-weight:700;color:#145da0}.person strong{display:block;font-size:17px}.person span{display:block;color:#60758a;margin-top:3px}.no-photo{font-size:12px;color:#8a9bad;margin-top:9px}.empty{text-align:center;padding:60px;color:#64768a}.hidden{display:none!important}@media(max-width:620px){.shell{padding:18px 14px 34px}.top,.toolbar{align-items:flex-start}.brand h1{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person{padding:14px 8px}.photo{width:86px;height:86px}.person strong{font-size:15px}.person span{font-size:14px}}
  </style>
</head>
<body>
  <section id="login" class="login card">
    <div class="brand"><div class="logo">SCD</div><div><h2>ทะเบียนบุคลากร</h2><p>สิทธิ์ดูชื่อ นามสกุล และรูปถ่ายเท่านั้น</p></div></div>
    <label for="code">รหัสผู้ใช้</label><input id="code" autocomplete="username" placeholder="VIEW001">
    <label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginButton" type="button">เข้าสู่ระบบ</button><div id="message" class="message" role="alert"></div>
  </section>
  <main id="directory" class="shell hidden">
    <header class="top"><div class="brand"><div class="logo">SCD</div><div><h1>ทะเบียนบุคลากร</h1><p>แสดงเฉพาะชื่อ นามสกุล และรูปถ่าย</p></div></div><button id="logout" class="logout" type="button">ออกจากระบบ</button></header>
    <section class="toolbar card"><strong>รายชื่อพนักงานปัจจุบัน</strong><span id="count" class="count">กำลังโหลด…</span></section>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script src="/legacy/people-directory.js?v=20261117"></script>
</body>
</html>
